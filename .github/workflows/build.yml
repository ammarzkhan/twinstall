name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:

  # ---------------------------------------------------------------------------
  # The real build. Everything ships from here.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate preset data
        shell: pwsh
        run: |
          $j = Get-Content presets/apps.json -Raw | ConvertFrom-Json
          $ids = $j.apps.id
          if (($ids | Select-Object -Unique).Count -ne $ids.Count) { throw 'duplicate app ids' }
          foreach ($a in $j.apps) {
            # Deliberately NOT checking for a 'scheme' field. Presets carry no scheme and no
            # profile path - both are derived at run time by docs/DETECTION.md. An earlier
            # version of this check required one and would have failed on every entry.
            foreach ($f in 'id','displayName','exeName') {
              if (-not $a.$f) { throw "app '$($a.id)' is missing $f" }
            }
          }
          "presets OK - $($ids.Count) apps, $(($j.apps | Where-Object verified).Count) verified"

      - name: Lint PowerShell
        shell: pwsh
        run: |
          if (-not (Get-ChildItem -Recurse -Include *.ps1,*.psm1 -File)) {
            'no PowerShell in the tree - skipping'; return
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; throw "$($r.Count) analyzer errors" }
          'PSScriptAnalyzer clean'

      - name: Restore
        run: dotnet restore Twinstall.sln

      - name: Build
        run: dotnet build Twinstall.sln -c Release --no-restore

      - name: Unit tests
        shell: pwsh
        run: |
          # Plain console runner: exit code is the result, no test adapter involved.
          dotnet run --project src/Twinstall.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed (exit $LASTEXITCODE)" }

      - name: Analyser sweep
        shell: pwsh
        run: |
          # AnalysisMode=All alone does nothing here - AnalysisLevel in Directory.Build.props
          # re-derives the mode and wins, reporting a false clean. Use latest-all.
          $out = dotnet build Twinstall.sln -c Release --no-incremental `
                   -p:AnalysisLevel=latest-all -p:TreatWarningsAsErrors=false 2>&1 | Out-String

          # Count DISTINCT warnings. MSBuild reports each one once per project that
          # references the project producing it, so a raw match count roughly doubles the
          # real figure - it read 18 here against a real 9, and failed a gate meant for 10.
          $unique = $out -split "`r?`n" |
                    Where-Object { $_ -match ': warning ' } |
                    ForEach-Object { ($_ -replace '^.*?: warning ','') -replace ' \[.*$','' } |
                    Sort-Object -Unique

          "analyser warnings at latest-all: $($unique.Count)"
          $unique | ForEach-Object { "  $_" }

          # Ten are deliberate and documented in ENGINEERING.md. More than that wants a look.
          if ($unique.Count -gt 10) { throw "unexpected analyser warnings ($($unique.Count) > 10)" }

      - name: Publish release artifacts
        shell: pwsh
        run: pwsh -File scripts/publish.ps1

      # ---------------------------------------------------------------------
      # Code signing. Skipped entirely until a certificate exists, so the build
      # stays green without one — set the repository variable SIGNING_ENABLED to
      # 'true' once the secrets below are configured.
      #
      # Azure Trusted Signing is the assumed provider: it needs no hardware
      # token, which matters because every publicly-trusted code-signing
      # certificate has required the private key to live on FIPS-140-2 hardware
      # since June 2023. A .pfx in a secret is no longer a thing that exists.
      # SignPath Foundation is the free-for-open-source alternative and would
      # replace this step wholesale.
      #
      # UNTESTED until a certificate is in place. Read it before trusting it.
      # ---------------------------------------------------------------------
      - name: Sign executables
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Signing rewrites the executables, so any hash taken before it is wrong.
      # publish.ps1 writes SHA256SUMS.txt at the end of its own run, which is
      # before this point — so it is regenerated here rather than published
      # stale. A checksum file that does not match the download is worse than
      # none at all: it tells a careful user the file was tampered with.
      - name: Re-checksum after signing
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: twinstall-artifacts
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

  # ---------------------------------------------------------------------------
  # Guards the architecture, not the product.
  #
  # Twinstall.Core is declared platform-neutral (net8.0). This job proves it: if
  # anyone adds a Win32, WMI or GDI+ dependency to the decision logic, the build
  # or the tests fail here while the Windows job stays green — which is the only
  # way that mistake gets noticed early.
  # ---------------------------------------------------------------------------
  core-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build core and tests on Linux
        run: dotnet build src/Twinstall.Tests -c Release

      - name: Unit tests on Linux
        run: dotnet run --project src/Twinstall.Tests -c Release --no-build

  # ---------------------------------------------------------------------------
  # Tagged releases only. Publishes the single-file executables and their hashes.
  #
  # There is deliberately no MSIX step here yet. The manifest still carries REPLACE
  # placeholders and has no assets, and the question that gates it — whether Store
  # certification accepts an app declaring another vendor's URL scheme — is still
  # unanswered. A packaging job that cannot succeed is worse than no job at all.
  # ---------------------------------------------------------------------------
  release:
    needs: [windows, core-portability]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: twinstall-artifacts
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The body lives in .github/RELEASE_NOTES.md rather than inline. A multi-line string
          # inside a YAML block scalar has to stay indented past the block, and markdown does
          # not survive that: an unindented continuation line silently ends the block and the
          # whole workflow stops parsing, which is exactly what happened when it was written
          # inline. A file is also reviewable as markdown and editable without touching CI.
          #
          # This is the download page, so the body carries what a download page has to say:
          # what the software does, that the binaries are unsigned, how to verify them, and
          # what happens to your data — the last being a SignPath Foundation condition, and
          # worth stating plainly regardless.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Twinstall ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            artifacts/*.exe artifacts/SHA256SUMS.txt
