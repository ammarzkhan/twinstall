name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:

  # ---------------------------------------------------------------------------
  # The real build. Everything ships from here.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate preset data
        shell: pwsh
        run: |
          $j = Get-Content presets/apps.json -Raw | ConvertFrom-Json
          $ids = $j.apps.id
          if (($ids | Select-Object -Unique).Count -ne $ids.Count) { throw 'duplicate app ids' }
          foreach ($a in $j.apps) {
            foreach ($f in 'id','displayName','scheme','exeName') {
              if (-not $a.$f) { throw "app '$($a.id)' is missing $f" }
            }
          }
          "presets OK - $($ids.Count) apps, $(($j.apps | Where-Object verified).Count) verified"

      - name: Lint PowerShell
        shell: pwsh
        run: |
          if (-not (Get-ChildItem -Recurse -Include *.ps1,*.psm1 -File)) {
            'no PowerShell in the tree - skipping'; return
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; throw "$($r.Count) analyzer errors" }
          'PSScriptAnalyzer clean'

      - name: Restore
        run: dotnet restore Twinstall.sln

      - name: Build
        run: dotnet build Twinstall.sln -c Release --no-restore

      - name: Unit tests
        shell: pwsh
        run: |
          # Plain console runner: exit code is the result, no test adapter involved.
          dotnet run --project src/Twinstall.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed (exit $LASTEXITCODE)" }

      - name: Publish router binaries
        run: >
          dotnet publish src/Twinstall.Platform -c Release --no-build
          -o artifacts/platform

      - uses: actions/upload-artifact@v4
        with:
          name: Twinstall-build
          path: artifacts/platform

  # ---------------------------------------------------------------------------
  # Guards the architecture, not the product.
  #
  # Twinstall.Core is declared platform-neutral (net8.0). This job proves it: if
  # anyone adds a Win32, WMI or GDI+ dependency to the decision logic, the build
  # or the tests fail here while the Windows job stays green — which is the only
  # way that mistake gets noticed early.
  # ---------------------------------------------------------------------------
  core-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build core and tests on Linux
        run: dotnet build src/Twinstall.Tests -c Release

      - name: Unit tests on Linux
        run: dotnet run --project src/Twinstall.Tests -c Release --no-build

  # ---------------------------------------------------------------------------
  # Tagged releases only.
  # ---------------------------------------------------------------------------
  package:
    needs: [windows, core-portability]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Twinstall-build
          path: artifacts/platform

      - name: Package MSIX
        shell: pwsh
        run: |
          # makeappx ships with the Windows SDK, which is present on the hosted runners.
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
                 Where-Object { $_.Name -match '^10\.' } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'no Windows SDK found on the runner' }
          $makeappx = Join-Path $sdk.FullName 'x64\makeappx.exe'
          if (-not (Test-Path $makeappx)) { throw "makeappx not found under $($sdk.FullName)" }

          Copy-Item artifacts/platform/* src/Twinstall.Package -Recurse -Force
          & $makeappx pack /d src/Twinstall.Package /p Twinstall.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed (exit $LASTEXITCODE)" }

          # Store submissions are signed by Microsoft; this hash is for the GitHub channel,
          # where people need a way to check what they downloaded.
          Get-FileHash Twinstall.msix -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Twinstall-msix
          path: Twinstall.msix
